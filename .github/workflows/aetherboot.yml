# AetherBoot — compila Aether2Disk, AetherPlugson y AetherVInk para Windows
# y arma el paquete final aetherboot-<versión>-windows.zip.
#
# Se ejecuta al subir cambios a main, a mano (pestaña Actions → AetherBoot →
# Run workflow) o al subir una etiqueta que empiece por "aetherboot-".

name: AetherBoot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'aetherboot-*' ]

env:
  VENTOY_VER: "1.1.18"
  # SHA-256 del paquete oficial de Ventoy usado como base (comprobado)
  VENTOY_WIN_SHA256: "082c478e8c432e1ac653899fcf50e3a4077a2851bc6112b5ddd30545962164a9"

jobs:
  windows:
    name: Compilar programas de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Compilar Aether2Disk, AetherPlugson y AetherVInk
        shell: pwsh
        run: |
          # Prueba los conjuntos de herramientas instalados en el servidor, en orden.
          function Compilar($sln, $plat, $obligatorio) {
            foreach ($ts in 'v143', 'v145', 'v144') {
              Write-Host "::group::$sln | $plat | $ts"
              msbuild $sln /m /nologo /v:m /p:Configuration=Release /p:Platform=$plat `
                      /p:PlatformToolset=$ts /p:WindowsTargetPlatformVersion=10.0
              $rc = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($rc -eq 0) { Write-Host "OK  $sln ($plat, $ts)"; return }
            }
            if ($obligatorio) { throw "Falló la compilación de $sln ($plat)" }
            Write-Host "::warning::$sln ($plat) no se pudo compilar; se omite"
          }
          Compilar 'Ventoy2Disk\Ventoy2Disk.sln' 'Win32' $true
          Compilar 'Ventoy2Disk\Ventoy2Disk.sln' 'x64'   $true
          Compilar 'Ventoy2Disk\Ventoy2Disk.sln' 'ARM64' $false
          Compilar 'Ventoy2Disk\Ventoy2Disk.sln' 'ARM'   $false
          Compilar 'Plugson\vs\VentoyPlugson\VentoyPlugson.sln' 'Win32' $true
          Compilar 'Plugson\vs\VentoyPlugson\VentoyPlugson.sln' 'x64'   $true
          Compilar 'Vlnk\vs\VentoyVlnk\VentoyVlnk.sln' 'Win32' $true

      - name: Reunir ejecutables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exe | Out-Null
          $nombres = 'Ventoy2Disk.exe','Ventoy2Disk_X64.exe','Ventoy2Disk_ARM64.exe','Ventoy2Disk_ARM.exe',
                     'VentoyPlugson.exe','VentoyPlugson_X64.exe','VentoyVlnk.exe'
          foreach ($n in $nombres) {
            $f = Get-ChildItem -Recurse -File -Filter $n -Path Ventoy2Disk, Plugson\vs, Vlnk\vs |
                 Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
            if ($f) { Copy-Item $f.FullName exe\ ; Write-Host "OK  $n" } else { Write-Host "--  $n (no generado)" }
          }
          foreach ($n in 'Ventoy2Disk.exe','VentoyPlugson.exe','VentoyVlnk.exe') {
            if (-not (Test-Path "exe\$n")) { throw "Falta $n" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ejecutables-windows
          path: exe/

  aetherfusboot:
    name: Compilar AetherFUSboot (derivado de Rufus)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Compilar AetherFUSboot
        shell: pwsh
        working-directory: AetherFUSboot
        run: |
          function Compilar($plat, $obligatorio) {
            foreach ($ts in 'v145', 'v143', 'v144') {
              Write-Host "::group::AetherFUSboot | $plat | $ts"
              msbuild rufus.sln /m /nologo /v:m /p:Configuration=Release /p:Platform=$plat `
                      /p:PlatformToolset=$ts
              $rc = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($rc -eq 0) { Write-Host "OK  AetherFUSboot ($plat, $ts)"; return }
            }
            if ($obligatorio) { throw "Falló la compilación de AetherFUSboot ($plat)" }
            Write-Host "::warning::AetherFUSboot ($plat) no se pudo compilar; se omite"
          }
          Compilar 'x64'   $true
          Compilar 'x86'   $false
          Compilar 'arm64' $false

      - name: Reunir ejecutables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          $mapa = @{ 'x64' = 'AetherFUSboot.exe'; 'x86' = 'AetherFUSboot_x86.exe'; 'arm64' = 'AetherFUSboot_ARM64.exe' }
          foreach ($k in $mapa.Keys) {
            $f = Join-Path "AetherFUSboot\$k\Release" 'rufus.exe'
            if (Test-Path $f) { Copy-Item $f "salida\$($mapa[$k])"; Write-Host "OK  $($mapa[$k])" }
            else { Write-Host "--  $($mapa[$k]) (no generado)" }
          }
          if (-not (Test-Path 'salida\AetherFUSboot.exe')) { throw 'Falta AetherFUSboot.exe' }
          Copy-Item AetherFUSboot\LICENSE.txt salida\LICENCIA.txt
          Copy-Item AetherFUSboot\LEEME_AetherFUSboot.md salida\LEEME.md
          Get-ChildItem salida | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content salida\SHA256SUMS.txt
          Get-Content salida\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aetherfusboot-windows
          path: salida/

      - name: Captura de pantalla de AetherFUSboot
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force capturas | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
          }
          "@
          [W]::SetProcessDPIAware() | Out-Null
          function Foto($nombre, $x, $y, $w, $h) {
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, $bmp.Size)
            $bmp.Save("capturas\$nombre.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $p = Start-Process -FilePath salida\AetherFUSboot.exe -PassThru
          Start-Sleep -Seconds 8
          $h = [IntPtr]::Zero
          foreach ($t in 1..10) {
            $h = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowHandle
            if ($h -ne [IntPtr]::Zero) { break }
            Start-Sleep -Seconds 1
          }
          $s = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Foto 'pantalla_completa' 0 0 $s.Width $s.Height
          if ($h -ne [IntPtr]::Zero) {
            [W]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Milliseconds 800
            $r = New-Object W+RECT
            [W]::GetWindowRect($h, [ref]$r) | Out-Null
            Foto 'aetherfusboot' $r.L $r.T ($r.R - $r.L) ($r.B - $r.T)
            # pasar el ratón por encima del botón CERRAR (abajo a la derecha)
            [W]::SetCursorPos($r.R - 90, $r.B - 70) | Out-Null
            Start-Sleep -Milliseconds 900
            Foto 'aetherfusboot_hover' $r.L $r.T ($r.R - $r.L) ($r.B - $r.T)
          } else { Write-Host 'No se encontró la ventana' }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aetherfusboot-capturas
          path: capturas/

  paquete:
    name: Armar paquete de AetherBoot
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ejecutables-windows
          path: exe

      - name: Descargar y verificar el paquete base de Ventoy
        run: |
          curl -fsSL -o base.zip \
            "https://github.com/ventoy/Ventoy/releases/download/v${VENTOY_VER}/ventoy-${VENTOY_VER}-windows.zip"
          echo "${VENTOY_WIN_SHA256}  base.zip" | sha256sum -c -

      - name: Construir la partición de arranque AetherBoot
        run: |
          unzip -q base.zip "ventoy-${VENTOY_VER}/ventoy/ventoy.disk.img.xz"
          bash AetherBoot/Build/construir_imagen_arranque.sh \
               "ventoy-${VENTOY_VER}/ventoy/ventoy.disk.img.xz" ventoy.disk.img.xz

      - name: Empaquetar
        run: |
          bash AetherBoot/Build/empaquetar_windows.sh base.zip ventoy.disk.img.xz \
               "aetherboot-${VENTOY_VER}-windows.zip" exe
          sha256sum "aetherboot-${VENTOY_VER}-windows.zip" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aetherboot-windows
          path: |
            aetherboot-*-windows.zip
            SHA256SUMS.txt

  prueba-arranque:
    name: Prueba de arranque real (QEMU, BIOS y UEFI)
    needs: paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aetherboot-windows
          path: paquete

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf busybox-static grub-pc-bin \
               grub-efi-amd64-bin grub-common xorriso mtools exfatprogs cpio

      - name: Instalar AetherBoot en disco virtual y arrancarlo
        run: |
          sudo bash AetherBoot/Tests/prueba_arranque.sh paquete/aetherboot-*-windows.zip resultados

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-arranque-capturas
          path: resultados/

  publicar-capturas:
    name: Publicar capturas en la rama "capturas"
    needs: [aetherfusboot, prueba-arranque]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aetherfusboot-capturas
          path: pub/aetherfusboot
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: prueba-arranque-capturas
          path: pub/arranque
        continue-on-error: true
      - name: Subir a la rama capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pub
          find . -type f ! -name '*.png' -delete || true
          ls -R
          git init -q
          git config user.name "aetherboot-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b capturas
          git add -A
          git commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas

