# AetherBoot - menú extendido predeterminado (F6)
# Se muestra cuando la USB no tiene el archivo ventoy/ventoy_grub.cfg.
# Para tener un menú F6 propio, cree ese archivo en la partición Aether
# (carpeta "ventoy", en minúsculas) con entradas de GRUB.

menuentry "Cómo personalizar este menú (crear ventoy/ventoy_grub.cfg)" --class=debug_info --class=F5tool {
    echo ""
    echo " MENÚ EXTENDIDO DE AETHERBOOT (F6)"
    echo " ---------------------------------"
    echo ""
    echo " Este menú se puede personalizar. En la partición Aether de la USB:"
    echo ""
    echo "   1. Cree la carpeta  ventoy  (en minúsculas), si no existe."
    echo "   2. Dentro, cree el archivo  ventoy_grub.cfg  con entradas de GRUB."
    echo "   3. Ejemplo de entrada:"
    echo ""
    echo "        menuentry \"Mi sistema\" {"
    echo "            chainloader (hd1,1)/EFI/Boot/bootx64.efi"
    echo "        }"
    echo ""
    echo " Mientras tanto, aquí tiene accesos rápidos de energía y firmware."
    echo ""
    echo -en " $VTLANG_ENTER_EXIT ..."
    read vtInputKey
}

menuentry "$VTLANG_POWER_REBOOT" --class=debug_reboot --class=debug_power --class=F5tool {
    echo -e '\n\nReiniciando el sistema ... \n'
    sleep 1
    reboot
}

menuentry "$VTLANG_POWER_HALT" --class=debug_halt --class=debug_power --class=F5tool {
    echo -e '\n\nApagando el sistema ... \n'
    sleep 1
    halt
}

if [ "$grub_platform" != "pc" ]; then
    menuentry "$VTLANG_POWER_BOOT_EFIFW" --class=debug_efisetup --class=debug_power --class=F5tool {
        echo -e '\n\nReiniciando para entrar a la configuración del firmware UEFI ... \n'
        sleep 1
        fwsetup
    }
fi

menuentry "$VTLANG_RETURN_PREVIOUS" --class=vtoyret VTOY_RET {
    echo "Volviendo ..."
}
