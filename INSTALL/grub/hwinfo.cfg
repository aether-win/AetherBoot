menuentry "$VTLANG_HWINFO" --class=debug_hwinfo --class=F5tool {    
    smbios -t 4 -s 0x10 --set=cpu_brand
    
    set system_vendor="-";
    smbios -t 1 -s 0x04 --set=system_vendor;
    set system_product="-";
    smbios -t 1 -s 0x05 --set=system_product;
    set system_version="-";
    smbios -t 1 -s 0x06 --set=system_version;

    set board_vendor="-";
    smbios -t 2 -s 0x04 --set=board_vendor;
    set board_product="-";
    smbios -t 2 -s 0x05 --set=board_product;
    set board_version="-";
    smbios -t 2 -s 0x06 --set=board_version;

    set bios_vendor="-";
    smbios -t 0 -s 0x04 --set=bios_vendor;
    set bios_version="-";
    smbios -t 0 -s 0x05 --set=bios_ver;
    set bios_date="-";
    smbios -t 0 -s 0x08 --set=bios_date;
    set bios_size="-";
    smbios -t 0 -b 0x09 --set=bios_size;
    

    echo "Plataforma              $grub_cpu-$grub_platform"    
    if [ "$grub_platform" != "pc" ]; then
        echo "Versión UEFI            $grub_uefi_version"
        echo "Versión PI              $grub_pi_version"
        if vt_check_secureboot_var; then
            echo "Arranque seguro         Activado"
        else
            echo "Arranque seguro         Desactivado"
        fi
        
        vt_sbinfo
    fi    

    echo ""    
    echo "Modelo de CPU           $cpu_brand"
    echo "Memoria RAM física      $grub_total_ram MB"
                                  
    echo ""                       
    echo "Fabricante              $system_vendor"
    echo "Producto                $system_product"
    echo "Versión                 $system_version"
                                  
    echo ""                       
    echo "Fabricante de placa     $board_vendor"
    echo "Placa base              $board_product"
    echo "Versión de placa        $board_version"
                                  
    echo ""                       
    echo "Fabricante de BIOS      $bios_vendor"
    echo "Versión de BIOS         $bios_ver"
    echo "Fecha de BIOS           $bios_date"
    echo "Tamaño de ROM BIOS      $bios_size"
    
    
    echo -en "\n\n\n$VTLANG_ENTER_EXIT ..."
    read vtInputKey
}
